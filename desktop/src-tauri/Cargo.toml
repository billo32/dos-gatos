[package]
name = "tc001-agent"
version = "0.4.0"
edition = "2021"
description = "Tray agent for Ulanzi TC001 USB firmware"
license = "MIT"
repository = "https://github.com/billo32/dos-gatos"

[lib]
name = "tc001_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
regex = "1"
tiny_http = "0.12"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
