<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="height: 50px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; background: {{r.bg}}; border-bottom: 1px solid #EFEAE2">

<button type="button" onClick="{{r.pick}}" style="flex-grow: 1; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0">
<div style="width: 28px; height: 28px; border-radius: 7px; background: #1C1A17; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><div style="width: 10px; height: 10px; border-radius: 2px; background: {{r.color}}; box-shadow: 0 0 6px {{r.color}}"></div></div>
<div style="font-size: 14px; font-weight: 600">{{r.name}}</div>
<div style="font-size: 12px; color: #6A635A">{{r.dur}}</div>
</button>
<button type="button" onClick="{{r.open}}" aria-label="{{r.gearLabel}}" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 9px; border: 1px solid transparent; background: transparent; color: #5F584F; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
<button type="button" role="switch" onClick="{{r.toggle}}" aria-checked="{{r.on}}" aria-label="{{r.toggleLabel}}" style="width: 44px; height: 26px; flex-shrink: 0; border-radius: 13px; border: 0; padding: 3px; background: {{r.track}}; cursor: pointer; display: flex; justify-content: {{r.knob}}">

<div style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px 0 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ECE6DC">

<button type="button" onClick="{{closeModal}}" aria-label="Close" style="width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: #5F584F; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>

<sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
<sc-if value="{{f.isText}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="{{f.id}}" style="font-size: 13px; font-weight: 600; color: #1C1A17">{{f.label}}</label><input id="{{f.id}}" type="text" value="{{f.value}}" placeholder="{{f.ph}}" style="height: 40px; width: 100%; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #DCD5C9; background: #FFFFFF; font: inherit; font-size: 14px; color: #1C1A17"></div>
</sc-if>
<sc-if value="{{f.isNum}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><label for="{{f.id}}" style="font-size: 14px; font-weight: 500">{{f.label}}</label><div style="display: flex; align-items: center; gap: 8px"><input id="{{f.id}}" type="number" value="{{f.value}}" style="height: 40px; width: 100%; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #DCD5C9; background: #FFFFFF; font: inherit; font-size: 14px; color: #1C1A17; width: 84px"><span style="font-size: 13px; color: #6A635A">{{f.unit}}</span></div></div>

<button type="button" onClick="{{closeModal}}" style="height: 38px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: #B3261E; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Remove from playlist</button>

</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":660}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'weather', off: { music: true }, modal: null, flip: {} };
  }
  renderVals() {
    const sw = (on) => ({ on: on ? 'true' : 'false', track: on ? '#E2551F' : '#D6D0C6', knob: on ? 'flex-end' : 'flex-start' });
    const DEFS = [{"id": "clock", "name": "Clock", "dur": 10, "color": "#FFF1DC", "f": [["t", "24-hour format", true], ["t", "Show weekday bar", true]]}, {"id": "weather", "name": "Weather", "dur": 8, "color": "#FFD23F", "f": [["x", "Location", "Málaga, ES", ""], ["t", "Fahrenheit", false]]}, {"id": "calendar", "name": "Calendar", "dur": 8, "color": "#FF4B4B", "f": [["x", "Calendar link (iCal)", "", "https://…/calendar.ics"], ["n", "Remind before", 5, "min"]]}, {"id": "ci", "name": "CI status", "dur": 6, "color": "#3DDC84", "f": [["x", "Pipeline URL", "", "https://github.com/owner/repo"], ["t", "Only show failures", false]]}, {"id": "music", "name": "Now playing", "dur": 8, "color": "#B57BFF", "f": [["t", "Show track title", true]]}, {"id": "notify", "name": "Notifications", "dur": 5, "color": "#4DA3FF", "f": [["t", "Interrupt the playlist", true], ["t", "Beep on the clock", false]]}];
    const st = this.state;
    const off = st.off || {};
    const rows = DEFS.map((d) => {
      const on = !off[d.id];
      return { name: d.name, color: d.color, dur: d.dur + ' s', on: on ? 'true' : 'false',
        bg: d.id === st.sel ? '#FFF4EC' : '#FFFFFF', track: on ? '#E2551F' : '#D6D0C6', knob: on ? 'flex-end' : 'flex-start',
        toggleLabel: 'Show ' + d.name, gearLabel: d.name + ' settings',
        pick: () => this.setState({ sel: d.id }),
        open: () => this.setState({ modal: d.id, sel: d.id, flip: {} }),
        toggle: () => this.setState({ off: { ...off, [d.id]: on } }) };
    });
    const cur = DEFS.find((d) => d.id === st.sel) || DEFS[1];
    const m = DEFS.find((d) => d.id === st.modal);
    let fields = [];
    if (m) {
      const list = [['n', 'Show for', m.dur, 's']].concat(m.f);
      fields = list.map((f, i) => {
        const id = 'mf-' + i;
        const base = { id, label: f[1], isText: f[0] === 'x', isNum: f[0] === 'n', isToggle: f[0] === 't' };
        if (f[0] === 't') { const v = st.flip[id] ? !f[2] : f[2]; return { ...base, sw: sw(v), toggle: () => this.setState({ flip: { ...st.flip, [id]: !st.flip[id] } }) }; }
        if (f[0] === 'n') return { ...base, value: f[2], unit: f[3] };
        return { ...base, value: f[2], ph: f[3] };
      });
    }
    return { rows, selScreen: cur.id, selName: cur.name, fields,
      modalOpen: !!m, modalTitle: m ? m.name + ' settings' : '',
      closeModal: () => this.setState({ modal: null }),
      countLabel: DEFS.filter((d) => !off[d.id]).length + ' of ' + DEFS.length + ' screens on' };
  }
}
</script>
