<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":660}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { errs: false }; }
  renderVals() {
    const sw = (on) => ({ on: on ? 'true' : 'false', track: on ? '#E2551F' : '#D6D0C6', knob: on ? 'flex-end' : 'flex-start' });
    const ROWS = [["20:45:02", "info", "malaga-temp → 21.0 · 182 ms"], ["20:44:58", "info", "time sync · rtc drift −1 s · ok"], ["20:44:30", "warn", "amp-futures · HTTP 429 · retry in 60 s"], ["20:44:12", "info", "btc → 84486.12 · 94 ms"], ["20:43:01", "info", "rain-find → 0"], ["20:42:15", "info", "sent 4 sources to the clock · 1.1 KB"], ["20:41:50", "error", "amp-futures · timeout after 10 s"], ["20:39:12", "info", "connected /dev/cu.usbserial-110 · fw 0.4.2"], ["20:39:11", "warn", "port busy, retrying"], ["20:39:10", "info", "Dos GatOS started"]];
    const st = this.state;
    const DOT = { info: '#B7AFA3', warn: '#EDB54A', error: '#E5484D' };
    const rows = ROWS.filter((r) => !st.errs || r[1] !== 'info').map((r) => ({ t: r[0], lv: r[1], dot: DOT[r[1]], m: r[2], bg: r[1] === 'error' ? '#FFF8F7' : '#FFFFFF' }));
    return { rows, errs: sw(st.errs), tErrs: () => this.setState({ errs: !st.errs }) };
  }
}
</script>
