<div style="font-size: 13px; color: #6A635A">{{countLabel}}</div>

<div style="display: flex; gap: 8px"></div>
</div>
<div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0">
<div style="flex-grow: 1; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #DCD5C9; display: flex; align-items: center; gap: 8px; color: #6A635A">

<input aria-label="Search extensions" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Search extensions" style="flex-grow: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: #1C1A17">
</div>

<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: {{t.bg}}; box-shadow: {{t.sh}}; font: inherit; font-size: 13px; font-weight: 500; color: #1C1A17; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; border: 1px solid #E7E1D7; border-radius: 12px">
<sc-for list="{{rows}}" as="e" hint-placeholder-count="8">
<div style="min-height: 62px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 14px; border-bottom: 1px solid #EFEAE2">

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 8px"><div style="font-size: 14px; font-weight: 600">{{e.name}}</div><div style="font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 5px; background: {{e.tagBg}}; color: {{e.tagFg}}">{{e.tag}}</div></div>
<div style="font-size: 12px; color: #6A635A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{e.text}}</div>
</div>
<button type="button" onClick="{{e.toggle}}" style="height: 34px; min-width: 96px; padding: 0 14px; border-radius: 9px; border: 1px solid {{e.bd}}; background: {{e.bg}}; color: {{e.fg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">{{e.btn}}</button>
</div>
</sc-for>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":660}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', only: false, inst: { weather: true, ci: true, calendar: true, music: true, notify: true } };
  }
  renderVals() {
    const EXTS = [{"id": "weather", "name": "Weather", "text": "Open‑Meteo forecast, no API key. Temperature, precipitation, wind.", "official": true, "led": "#FFD23F"}, {"id": "crypto", "name": "Crypto ticker", "text": "Up to 10 coins in rotation, 24h change in color.", "official": false, "led": "#3DDC84"}, {"id": "ci", "name": "CI status", "text": "GitHub Actions and GitLab CI. Blinks when a build fails.", "official": true, "led": "#3DDC84"}, {"id": "calendar", "name": "Calendar", "text": "Any iCal link. Reminds you 5 minutes before a meeting.", "official": true, "led": "#FF4B4B"}, {"id": "pomodoro", "name": "Pomodoro", "text": "25/5 cycles started from the clock’s button, with daily stats.", "official": false, "led": "#FF4B4B"}, {"id": "music", "name": "Now playing", "text": "Track and equalizer from your Mac over USB.", "official": true, "led": "#B57BFF"}, {"id": "ha", "name": "Home Assistant", "text": "Any sensor or event, with color changes at thresholds.", "official": false, "led": "#FF7A3D"}, {"id": "notify", "name": "macOS notifications", "text": "Forward notifications from the apps you choose.", "official": true, "led": "#4DA3FF"}, {"id": "worldclock", "name": "World clock", "text": "Up to four time zones, cycling with city codes.", "official": true, "led": "#FFF1DC"}, {"id": "stocks", "name": "Stock watchlist", "text": "Your tickers with daily change and a sparkline row.", "official": false, "led": "#3DDC84"}, {"id": "uptime", "name": "Uptime monitor", "text": "Pings your endpoints and turns red when one goes down.", "official": false, "led": "#3DDC84"}, {"id": "air", "name": "Air quality", "text": "AQI and PM2.5 for your area, color‑coded.", "official": false, "led": "#FF7A3D"}];
    const st = this.state;
    const q = st.q.toLowerCase();
    const rows = EXTS.filter((e) => (!st.only || st.inst[e.id]) && (!q || (e.name + ' ' + e.text).toLowerCase().indexOf(q) >= 0)).map((e) => {
      const on = !!st.inst[e.id];
      return { ...e, tag: e.official ? 'Official' : 'Community', tagBg: e.official ? '#FDE7DC' : '#EFEAE2', tagFg: e.official ? '#8F3212' : '#5F584F',
        btn: on ? 'Installed' : 'Install', bg: on ? '#FFFFFF' : '#1C1A17', fg: on ? '#1E6B3F' : '#FAF7F2', bd: on ? '#CFE7D7' : '#1C1A17',
        toggle: () => this.setState({ inst: { ...st.inst, [e.id]: !on } }) };
    });
    const seg = (on) => ({ bg: on ? '#FFFFFF' : 'transparent', sh: on ? '0 1px 2px rgba(28,26,23,0.12)' : 'none', pressed: on ? 'true' : 'false' });
    const tabs = [[false, 'All'], [true, 'Installed']].map(([v, label]) => ({ label, ...seg(st.only === v), pick: () => this.setState({ only: v }) }));
    return { rows, tabs, q: st.q, onQ: (ev) => this.setState({ q: ev.target.value }),
      countLabel: Object.keys(st.inst).filter((k) => st.inst[k]).length + ' installed · new ones appear in the playlist' };
  }
}
</script>
