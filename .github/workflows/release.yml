# Релиз по тегу v*: прошивка (PlatformIO) + подписанный и нотаризованный Dos GatOS (universal).
# Результат — черновик релиза с .dmg и образом прошивки; опубликовать вручную.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE           base64 от .p12 «Developer ID Application» (base64 -i cert.p12 | pbcopy)
#   APPLE_CERTIFICATE_PASSWORD  пароль, заданный при экспорте .p12
#   KEYCHAIN_PASSWORD           любой случайный пароль для временной связки ключей
#   APPLE_API_ISSUER            Issuer ID из App Store Connect → Integrations
#   APPLE_API_KEY               Key ID
#   APPLE_API_KEY_P8            содержимое файла AuthKey_<KeyID>.p8

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio esptool
      - run: pio run -d firmware
      - name: Единый образ для прошивки с адреса 0x0
        run: |
          B=firmware/.pio/build/tc001
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          esptool --chip esp32 merge-bin -o tc001-usb-merged.bin \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: tc001-usb-merged.bin

  desktop:
    runs-on: macos-latest
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: desktop

      - name: Сертификат Developer ID во временную связку ключей
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security set-keychain-settings -lut 3600 $KC
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security import $RUNNER_TEMP/cert.p12 -k $KC -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/cert.p12
          ID=$(security find-identity -v -p codesigning $KC | grep -m1 '"Developer ID Application' | sed -E 's/.*"(.*)"/\1/')
          test -n "$ID" || { echo "в .p12 нет Developer ID Application"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$ID" >> $GITHUB_ENV

      - name: Ключ App Store Connect для нотаризации
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"

      - name: Сборка, подпись, нотаризация
        working-directory: desktop
        run: ./scripts/build-signed.sh --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: [firmware, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/tc001-usb-merged.bin "dist/tc001-usb-${GITHUB_REF_NAME}-merged.bin"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "dos-gatos $GITHUB_REF_NAME"
